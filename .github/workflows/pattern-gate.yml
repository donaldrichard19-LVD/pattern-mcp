name: Pattern gate

# Required-check template for the enforcement boundary (see BACKLOG.md's
# "Enforcement boundary: hook + CI gate" entry). Copy this into your own
# repo's .github/workflows/ and mark the "pattern-gate" job required in
# branch protection. Opt-in -- pattern-mcp never installs this for you.
#
# Deliberately does NOT need a GITHUB_TOKEN or any secret: it only reads
# the receipt files already committed in this PR's diff
# (.pattern/receipts/*.json), which were written locally by the
# PreToolUse hook (see ../hooks/check-gate-hook.mjs) when the gate
# passed. It never touches ~/.pattern/ledger.jsonl, which isn't reachable
# from a CI runner at all -- see gate-receipt.ts for why the receipt file
# is the artifact of record here, not a posted PR comment.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pattern-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Compute added files
        id: diff
        env:
          # Passed through the environment, never interpolated into the script:
          # the base branch name and (below) file names come from the PR.
          BASE_REF: ${{ github.base_ref }}
        run: |
          ADDED=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD")
          MODIFIED=$(git diff --name-only --diff-filter=M "origin/${BASE_REF}...HEAD")
          DELIM="PATTERN_FILES_$(date +%s%N)"
          {
            echo "files<<${DELIM}"
            echo "${ADDED}"
            echo "${DELIM}"
            echo "modified<<${DELIM}"
            echo "${MODIFIED}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
      - name: Run pattern-check-gate verify
        if: steps.diff.outputs.files != '' || steps.diff.outputs.modified != ''
        env:
          ADDED_FILES: ${{ steps.diff.outputs.files }}
          MODIFIED_FILES: ${{ steps.diff.outputs.modified }}
          BASE_REF: ${{ github.base_ref }}
        # One file name per line -> one array element each. The lists are passed as
        # quoted array expansions, never interpolated into the script. Modified files
        # are checked for components added inside them, compared against the base ref.
        # Interpolating the list straight into `run:` would execute every file
        # name after the first as a command, and let a hostile name inject shell.
        run: |
          mapfile -t ADDED < <(printf '%s\n' "$ADDED_FILES" | sed '/^$/d')
          mapfile -t MODIFIED < <(printf '%s\n' "$MODIFIED_FILES" | sed '/^$/d')
          if [ "${#ADDED[@]}" -eq 0 ] && [ "${#MODIFIED[@]}" -eq 0 ]; then exit 0; fi
          npx --yes -p pattern-mcp@latest pattern-check-gate verify --project-root "$PWD" --base "origin/${BASE_REF}" --modified-files "${MODIFIED[@]}" --files "${ADDED[@]}"
