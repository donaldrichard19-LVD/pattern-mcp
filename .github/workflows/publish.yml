name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # required for npm Trusted Publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # actions/setup-node's bundled npm (10.x on Node 20) predates npm's
      # Trusted Publishing/OIDC support (needs npm 11.5.1+) -- without this,
      # npm publish sends no auth at all and the registry 404s.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish
