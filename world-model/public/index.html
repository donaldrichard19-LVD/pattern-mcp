<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product World Model</title>
<style>
:root {
  --bg:#f6f7f9; --panel:#fff; --ink:#1b1f27; --muted:#5d6675; --line:#dfe3ea; --accent:#3b5bdb; --accent-ink:#fff;
  --warn:#b45309; --bad:#b42318; --ok:#157347;
  --segment:#2563eb; --outcome:#15803d; --problem:#c2410c; --feature:#7c3aed; --metric:#0e7490; --assumption:#a16207; --decision:#475569;
  --shadow:0 1px 2px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#12151b; --panel:#1b2029; --ink:#e8ebf0; --muted:#9aa4b2; --line:#2c3340; --accent:#7c93ff; --accent-ink:#0b1020;
    --warn:#f5b255; --bad:#ff8a80; --ok:#6ee7a0;
    --segment:#7aa7ff; --outcome:#58d68d; --problem:#ff9f6b; --feature:#b79bff; --metric:#5fd3e8; --assumption:#f0c75e; --decision:#a7b3c5; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
button, select, input, textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 10px; }
button:hover { border-color:var(--accent); }
button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
button.danger { color:var(--bad); }
button:disabled { opacity:.5; cursor:default; }
select, input[type=text], input[type=number], textarea { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
textarea { width:100%; min-height:70px; resize:vertical; }
:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
header h1 { font-size:15px; margin:0; }
nav { display:flex; gap:2px; flex-wrap:wrap; }
nav button { border:0; background:none; border-radius:6px; padding:6px 12px; color:var(--muted); }
nav button[aria-selected=true] { background:var(--bg); color:var(--ink); font-weight:600; }
.badge { display:inline-block; min-width:18px; padding:0 6px; border-radius:9px; background:var(--accent); color:var(--accent-ink); font-size:11px; text-align:center; margin-left:4px; }
.spacer { flex:1; }
main { padding:14px 16px 60px; }
.filters { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-bottom:10px; color:var(--muted); }
.filters label { display:flex; gap:5px; align-items:center; }
.legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:8px; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
#mapwrap { position:relative; overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
#map { position:relative; display:flex; gap:52px; padding:16px 20px 24px; min-width:max-content; }
#edges { position:absolute; inset:0; pointer-events:none; }
.col { width:184px; display:flex; flex-direction:column; gap:10px; position:relative; z-index:1; }
.col h3 { margin:0 0 2px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.node { text-align:left; width:100%; border:1px solid var(--line); border-left:4px solid var(--c); border-radius:8px; background:var(--panel); padding:7px 9px; box-shadow:var(--shadow); transition:opacity .15s; }
.node:hover { border-color:var(--c); }
.node.dim { opacity:.18; }
.node.selected { outline:2px solid var(--accent); }
.node.hl { box-shadow:0 0 0 2px var(--c); }
.node .t { font-weight:600; font-size:13px; }
.node .m { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; font-size:11px; color:var(--muted); }
.chip { border:1px solid var(--line); border-radius:10px; padding:0 6px; font-size:11px; color:var(--muted); background:var(--bg); }
.chip.warn { color:var(--warn); border-color:var(--warn); }
.chip.bad { color:var(--bad); border-color:var(--bad); }
.chip.ok { color:var(--ok); border-color:var(--ok); }
.t-segment{--c:var(--segment)} .t-outcome{--c:var(--outcome)} .t-problem{--c:var(--problem)} .t-feature{--c:var(--feature)}
.t-metric{--c:var(--metric)} .t-assumption{--c:var(--assumption)} .t-decision{--c:var(--decision)}
.edge { fill:none; stroke:var(--muted); stroke-width:1.2; opacity:.45; }
.edge.affects { stroke-dasharray:4 3; }
.edge.dim { opacity:.08; }
.edge.hl { stroke:var(--accent); stroke-width:2.2; opacity:1; }
#drawer { position:fixed; top:0; right:0; bottom:0; width:min(440px,100%); background:var(--panel); border-left:1px solid var(--line); box-shadow:-6px 0 24px rgba(0,0,0,.12); overflow:auto; padding:16px; z-index:30; }
#drawer h2 { margin:6px 0 4px; font-size:17px; }
#drawer h4 { margin:16px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
.kv { display:grid; grid-template-columns:90px 1fr; gap:2px 10px; font-size:13px; }
.kv dt { color:var(--muted); } .kv dd { margin:0; }
blockquote { margin:0 0 8px; padding:6px 10px; border-left:3px solid var(--line); background:var(--bg); border-radius:0 6px 6px 0; }
blockquote.contradicts { border-left-color:var(--bad); }
.src { font-size:12px; color:var(--muted); margin-top:3px; }
a.link, button.link { background:none; border:0; padding:0; color:var(--accent); text-decoration:underline; cursor:pointer; }
.rel { display:block; margin:2px 0; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow); }
.card .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.warnbox { background:rgba(180,83,9,.1); border:1px solid var(--warn); color:var(--warn); border-radius:6px; padding:4px 8px; margin-top:6px; font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
.big { font-size:34px; font-weight:700; line-height:1.1; }
.muted { color:var(--muted); }
details { margin-top:8px; } summary { cursor:pointer; color:var(--accent); }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
.modal > div { background:var(--panel); border-radius:10px; max-width:760px; width:100%; max-height:85vh; overflow:auto; padding:16px; }
.modal pre { white-space:pre-wrap; font:13px/1.5 ui-monospace,Menlo,monospace; margin:0; }
mark { background:#ffe58a; color:#1b1f27; padding:0 1px; }
.diff { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
.diff pre { margin:0; padding:6px; border-radius:6px; font:12px ui-monospace,Menlo,monospace; white-space:pre-wrap; overflow:auto; background:var(--bg); }
.diff .a { border-left:3px solid var(--ok); } .diff .b { border-left:3px solid var(--bad); }
.pov { max-width:780px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 24px 20px; }
.pov h1 { font-size:22px; } .pov h2 { font-size:17px; margin-top:22px; } .pov h3 { font-size:15px; }
form.inline { display:grid; gap:6px; margin-top:6px; }
.toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; z-index:60; }
.empty { text-align:center; padding:60px 20px; color:var(--muted); }
@media (max-width:700px){ main{padding:10px} header{padding:8px 10px} }
</style>
</head>
<body>
<header>
  <h1>Product World Model</h1>
  <select id="modelSel" aria-label="Model"></select>
  <button id="newModel">New model</button>
  <nav id="tabs" role="tablist"></nav>
  <span class="spacer"></span>
  <span class="muted" id="verLabel"></span>
  <label class="muted">You <input type="text" id="actor" size="10" aria-label="Your name"></label>
</header>
<main id="main"></main>
<div id="drawerHost"></div>
<div id="modalHost"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const TYPES = ["segment","outcome","problem","feature","metric","assumption","decision"];
const COLS = [["segment","Users"],["outcome","Desired outcomes"],["problem","Problems"],["feature","Features"],["metric","Metrics"],["context","Assumptions & decisions"]];
const EDGE_RULES = {
  wants:{from:["segment"],to:["outcome"]}, blocked_by:{from:["outcome"],to:["problem"]},
  addresses:{from:["feature"],to:["problem","outcome"]}, moves:{from:["feature"],to:["metric"]},
  affects:{from:["decision","assumption"],to:["segment","outcome","problem","feature","metric","assumption","decision","product_area"]},
};
const FLAG_LABEL = { orphan:"orphan", gap:"gap", unmeasured:"unmeasured", stale:"stale", contradiction:"contradiction", unowned:"unowned" };

// DOM builder: text is always set as text nodes, never parsed as HTML.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith("aria-") && typeof v === "boolean") { el.setAttribute(k, String(v)); continue; }
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const ls = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const state = { models: [], modelId: ls.get("wm_model", ""), data: null, tab: "map", selected: null, traceId: null, traceSet: null,
  filters: { segment: "", metric: "", status: "", flag: "" }, staleDays: 30, actor: ls.get("wm_actor", "owner") };
const traceCache = new Map();

function toast(msg) { const t = h("div", { class: "toast", role: "status" }, msg); document.body.append(t); setTimeout(() => t.remove(), 3500); }
async function api(path, opts = {}, retry = true) {
  const headers = { "content-type": "application/json", "x-actor": state.actor || "owner" };
  const tok = ls.get("wm_token", ""); if (tok) headers.authorization = "Bearer " + tok;
  const r = await fetch(path, { ...opts, headers });
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (r.status === 403 && retry) {
    const t = prompt("This server requires the owner token to change the model:");
    if (t) { ls.set("wm_token", t); return api(path, opts, false); }
  }
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}
const post = (p, b) => api(p, { method: "POST", body: JSON.stringify(b) });
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message); } };
const ago = (iso) => { const d = Math.floor((Date.now() - Date.parse(iso)) / 864e5); return d <= 0 ? "today" : d === 1 ? "1 day ago" : d + " days ago"; };
const nodeById = (id) => state.data.nodes.find((n) => n.id === id);

// ---------- loading ----------
async function loadModels() {
  state.models = await api("/models");
  if (!state.models.find((m) => m.id === state.modelId)) state.modelId = state.models[0]?.id || "";
  const sel = $("#modelSel"); sel.replaceChildren(...state.models.map((m) => h("option", { value: m.id, selected: m.id === state.modelId }, m.name)));
  sel.hidden = !state.models.length;
}
async function loadModel() {
  if (!state.modelId) { state.data = null; return render(); }
  ls.set("wm_model", state.modelId);
  state.data = await api(`/models/${state.modelId}?stale_days=${state.staleDays}`);
  traceCache.clear();
  if (state.selected && !nodeById(state.selected)) state.selected = null;
  render();
}
async function refresh() { await loadModels(); await loadModel(); }

// ---------- shell ----------
function renderTabs() {
  const tabs = [["map","Map"],["review","Review queue"],["changelog","Changelog"],["health","Health"],["sources","Sources"],["pov","POV"]];
  $("#tabs").replaceChildren(...tabs.map(([id, label]) => h("button", { role: "tab", "aria-selected": state.tab === id, onclick: () => { state.tab = id; closeDrawer(); render(); } },
    label, id === "review" && state.data?.pending_proposals ? h("span", { class: "badge" }, state.data.pending_proposals) : null)));
  $("#verLabel").textContent = state.data ? `v${state.data.version}` : "";
}
function render() {
  renderTabs();
  const main = $("#main");
  if (!state.data) {
    main.replaceChildren(h("div", { class: "empty" }, h("h2", {}, "No world model yet"),
      h("p", {}, "Create a model for a product area, then upload the documents that define it."),
      h("button", { class: "primary", onclick: guard(newModel) }, "Create a model"), " ",
      h("button", { onclick: guard(async () => { const r = await post("/demo", {}); state.modelId = r.id; await refresh(); toast("Demo model loaded"); }) }, "Load the demo (PM artifacts)")));
    return;
  }
  ({ map: renderMap, review: renderReview, changelog: renderChangelog, health: renderHealth, sources: renderSources, pov: renderPov }[state.tab])(main);
}
async function newModel() {
  const name = prompt("Name the product area (e.g. 'PM artifacts: PRDs and product briefs')");
  if (!name) return;
  const r = await post("/models", { name }); state.modelId = r.id; state.tab = "sources"; await refresh();
}

// ---------- map ----------
async function visibleSet() {
  const f = state.filters, d = state.data; let set = null;
  const inter = (s) => (set = set ? new Set([...set].filter((x) => s.has(x))) : s);
  for (const id of [f.segment, f.metric]) if (id) inter(await traceIds(id));
  if (f.status) inter(new Set(d.nodes.filter((n) => n.type !== "feature" || n.status === f.status).map((n) => n.id)));
  if (f.flag) inter(new Set(d.nodes.filter((n) => (d.health.flags_by_node[n.id] || []).some((x) => f.flag === "any" || x === f.flag)).map((n) => n.id)));
  return set;
}
async function traceIds(id) {
  if (!traceCache.has(id)) { const t = await api(`/nodes/${id}/trace`); traceCache.set(id, new Set(t.nodes.map((n) => n.id))); }
  return traceCache.get(id);
}
async function renderMap(main) {
  const d = state.data, mine = state.modelId;
  const vis = await visibleSet();
  if (state.modelId !== mine || state.tab !== "map") return;
  const opt = (type) => d.nodes.filter((n) => n.type === type).map((n) => h("option", { value: n.id }, n.title));
  const sel = (key, label, first, opts) => { const s = h("select", { "aria-label": label, onchange: (e) => { state.filters[key] = e.target.value; state.traceId = null; state.traceSet = null; renderMap(main); } }, h("option", { value: "" }, first), opts); s.value = state.filters[key]; return h("label", {}, label, s); };
  const flagOpts = ["any", "orphan", "gap", "unmeasured", "stale", "contradiction", "unowned"].map((x) => h("option", { value: x }, x === "any" ? "any flag" : x));
  const filters = h("div", { class: "filters" },
    sel("segment", "Segment", "All", opt("segment")), sel("metric", "Metric", "All", opt("metric")),
    sel("status", "Feature status", "All", ["shipped", "in-flight", "proposed"].map((x) => h("option", { value: x }, x))),
    sel("flag", "Health", "All", flagOpts),
    h("label", {}, h("input", { type: "checkbox", checked: !!state.traceId, onchange: (e) => { if (!e.target.checked) clearTrace(); else if (state.selected) setTrace(state.selected); else { e.target.checked = false; toast("Select a node first, then turn on Trace"); } } }), "Trace mode"),
    (state.filters.segment || state.filters.metric || state.filters.status || state.filters.flag) ? h("button", { onclick: () => { state.filters = { segment: "", metric: "", status: "", flag: "" }; renderMap(main); } }, "Clear filters") : null);
  const legend = h("div", { class: "legend" }, TYPES.map((t) => h("span", {}, h("i", { style: `background:var(--${t})` }), t)), h("span", {}, "Arrows run user → outcome → problem ← feature → metric"));
  const byCol = (c) => d.nodes.filter((n) => (c === "context" ? ["assumption", "decision"].includes(n.type) : n.type === c));
  const order = orderNodes(d);
  const cols = COLS.map(([c, title]) => h("div", { class: "col", "data-col": c }, h("h3", {}, title),
    byCol(c).sort((a, b) => order.get(a.id) - order.get(b.id)).map((n) => nodeCard(n, vis))));
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.id = "edges";
  svg.innerHTML = '<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="currentColor" opacity=".6"/></marker></defs>';
  const wrap = h("div", { id: "mapwrap" }, h("div", { id: "map" }, svg, cols));
  main.replaceChildren(filters, legend, wrap);
  const draw = () => drawEdges(vis); draw(); requestAnimationFrame(draw);
  if (document.fonts?.ready) document.fonts.ready.then(draw);
  window.onresize = draw;
  if (state.selected) openDrawer(state.selected, true);
}
function orderNodes(d) {
  const pos = new Map(), cols = ["segment","outcome","problem","feature","metric"];
  const adj = (id) => d.edges.filter((e) => e.from_id === id || e.to_id === id).map((e) => (e.from_id === id ? e.to_id : e.from_id));
  d.nodes.filter((n) => n.type === "segment").forEach((n, i) => pos.set(n.id, i));
  for (const type of cols.slice(1)) {
    const mine = d.nodes.filter((n) => n.type === type);
    const score = (n) => { const s = adj(n.id).filter((x) => pos.has(x)).map((x) => pos.get(x)); return s.length ? Math.min(...s) : 1e3; };
    mine.map((n, i) => [n, score(n), i]).sort((a, b) => a[1] - b[1] || a[2] - b[2]).forEach(([n], i) => pos.set(n.id, i + (type === "metric" ? 0 : 0)));
  }
  d.nodes.filter((n) => ["assumption","decision"].includes(n.type)).forEach((n, i) => pos.set(n.id, i));
  return pos;
}
function nodeCard(n, vis) {
  const flags = state.data.health.flags_by_node[n.id] || [];
  const dim = (vis && !vis.has(n.id)) || (state.traceSet && !state.traceSet.has(n.id));
  return h("button", { class: `node t-${n.type}${dim ? " dim" : ""}${state.selected === n.id ? " selected" : ""}${state.traceSet?.has(n.id) ? " hl" : ""}`, "data-id": n.id, onclick: guard(() => selectNode(n.id)), title: n.title },
    h("div", { class: "t" }, n.title),
    h("div", { class: "m" },
      n.type === "feature" && n.status ? h("span", { class: `chip ${n.status === "shipped" ? "ok" : ""}` }, n.status) : null,
      ...flags.map((f) => h("span", { class: `chip ${f === "contradiction" ? "bad" : "warn"}` }, f)),
      h("span", { class: "chip" }, `${n.evidence_count} evidence`),
      n.confidence === "low" ? h("span", { class: "chip warn" }, "low confidence") : null));
}
function drawEdges(vis) {
  const svg = $("#edges"), map = $("#map"); if (!svg || !map) return;
  svg.setAttribute("width", map.scrollWidth); svg.setAttribute("height", map.scrollHeight);
  const base = map.getBoundingClientRect(), els = new Map([...map.querySelectorAll(".node")].map((e) => [e.dataset.id, e]));
  const colIdx = (id) => { const t = nodeById(id)?.type; return ["segment","outcome","problem","feature","metric"].indexOf(t) >= 0 ? ["segment","outcome","problem","feature","metric"].indexOf(t) : 5; };
  svg.querySelectorAll("path.edge").forEach((p) => p.remove());
  for (const e of state.data.edges) {
    const a = els.get(e.from_id), b = els.get(e.to_id); if (!a || !b) continue;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(), right = colIdx(e.from_id) < colIdx(e.to_id);
    const x1 = (right ? ra.right : ra.left) - base.left, y1 = ra.top + ra.height / 2 - base.top;
    const x2 = (right ? rb.left : rb.right) - base.left, y2 = rb.top + rb.height / 2 - base.top;
    const dx = Math.max(36, Math.abs(x2 - x1) / 2) * (right ? 1 : -1);
    const inTrace = state.traceSet && state.traceSet.has(e.from_id) && state.traceSet.has(e.to_id);
    const hidden = (vis && !(vis.has(e.from_id) && vis.has(e.to_id))) || (state.traceSet && !inTrace);
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`);
    p.setAttribute("class", `edge ${e.type}${hidden ? " dim" : ""}${inTrace ? " hl" : ""}`);
    p.setAttribute("marker-end", "url(#arr)"); p.style.color = "var(--muted)";
    const t = document.createElementNS("http://www.w3.org/2000/svg", "title"); t.textContent = e.type.replace("_", " "); p.append(t);
    svg.append(p);
  }
}
async function selectNode(id) { state.selected = id; if (state.traceId) await setTrace(id); else renderMap($("#main")); }
async function setTrace(id) { const t = await api(`/nodes/${id}/trace`); state.traceId = id; state.traceSet = new Set(t.nodes.map((n) => n.id)); renderMap($("#main")); }
function clearTrace() { state.traceId = null; state.traceSet = null; renderMap($("#main")); }

// ---------- detail drawer ----------
function closeDrawer() { $("#drawerHost").replaceChildren(); }
async function openDrawer(id) {
  const d = await api(`/nodes/${id}`), n = d.node, flags = state.data.health.flags_by_node[id] || [];
  const link = (other) => h("button", { class: "link rel", onclick: guard(() => { state.tab = "map"; selectNode(other.id); }) }, `${other.type}: ${other.title}`);
  const rels = [...d.outgoing.map((r) => [r.edge.type.replace("_", " ") + " →", r.node]), ...d.incoming.map((r) => ["← " + r.edge.type.replace("_", " "), r.node])];
